{% extends 'admin/base.html' %}
{% block title %}Yeni Fatura{% endblock %}
{% block content %}
<div class="admin-page">
  <div class="admin-header"><h1>Fatura Kaydı</h1></div>
  <form method="post" class="admin-card admin-form">
    <div class="form-row">
      <div class="form-group">
        <label>Danışan adı</label>
        <input type="text" name="patient_name" required>
      </div>
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" name="patient_email" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tutar</label>
        <input type="number" step="0.01" name="amount" required>
      </div>
      <div class="form-group">
        <label>Para birimi</label>
        <input type="text" name="currency" value="TRY">
      </div>
      <div class="form-group">
        <label>Tarih</label>
        <input type="date" name="invoice_date" value="{{ today.isoformat() }}">
      </div>
    </div>
    <div class="form-group">
      <label>Terapist</label>
      <select name="therapist_id">
        <option value="">—</option>
        {% for t in therapists %}
          <option value="{{ t.id }}">{{ t.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Açıklama</label>
      <input type="text" name="description" placeholder="Seans ücreti vb.">
    </div>
    <div class="form-group">
      <label>Durum</label>
      <select name="status">
        <option value="bekliyor">Bekliyor</option>
        <option value="odendi">Ödendi</option>
        <option value="iptal">İptal</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Kaydet</button>
  </form>
</div>
{% endblock %}
