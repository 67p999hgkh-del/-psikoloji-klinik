{% extends 'admin/base.html' %}
{% block title %}Terapist Notu{% endblock %}
{% block content %}
<div class="admin-page">
  <div class="admin-header"><h1>Terapist Notu</h1></div>
  <form method="post" class="admin-card admin-form">
    {% if therapists|length > 1 %}
      <div class="form-group">
        <label>Terapist</label>
        <select name="therapist_id" required>
          {% for t in therapists %}
            <option value="{{ t.id }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>
    {% else %}
      <input type="hidden" name="therapist_id" value="{{ therapists[0].id if therapists else '' }}">
    {% endif %}
    <div class="form-group">
      <label>Danışan e-posta</label>
      <input type="email" name="patient_email" required>
    </div>
    <div class="form-group">
      <label>Not</label>
      <textarea name="body" rows="5" required></textarea>
    </div>
    <label class="checkbox-row">
      <input type="checkbox" name="visible_to_client">
      Danışan portalında görünsün
    </label>
    <button type="submit" class="btn btn-primary">Kaydet</button>
  </form>
</div>
{% endblock %}
