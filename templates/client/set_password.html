{% extends 'base.html' %}
{% block content %}
<section class="section client-auth-section">
  <div class="container client-auth-box">
    <h1>Şifre Belirle</h1>
    <p>Merhaba {{ profile.full_name }}, hesabınızı aktifleştirmek için şifre oluşturun.</p>
    <form method="post" class="client-auth-form">
      <div class="form-group">
        <label>Yeni şifre</label>
        <input type="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Kaydet ve Giriş Yap</button>
    </form>
  </div>
</section>
{% endblock %}
