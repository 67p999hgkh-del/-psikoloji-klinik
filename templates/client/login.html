{% extends 'base.html' %}
{% block content %}
<section class="section client-auth-section">
  <div class="container client-auth-box">
    <h1>Üye Girişi</h1>
    <p>Randevularınızı, test sonuçlarınızı ve faturalarınızı görüntüleyin.</p>
    <form method="post" class="client-auth-form">
      <div class="form-group">
        <label>E-posta</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Şifre</label>
        <input type="password" name="password">
        <small class="muted">İlk girişinizde şifre alanını boş bırakın; sonraki adımda şifrenizi belirleyeceksiniz.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
    </form>
    <p class="muted">Hesabınız yok mu? <a href="{{ url_for('client_register') }}">Kayıt olun</a></p>
  </div>
</section>
{% endblock %}
