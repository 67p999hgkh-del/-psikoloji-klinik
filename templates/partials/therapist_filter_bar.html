<form class="therapist-filter-bar {% if session_type|default('yuz_yuze') == 'online' %}is-online{% endif %}" method="GET" action="{{ filter_action }}" data-search-form data-appointment-search-form>
  {% include 'partials/appointment_type_toggle.html' %}
  {% if specialty_filters is defined %}
    <div class="specialty-filter-chips" role="group" aria-label="Uzmanlık filtreleri">
      {% for spec in specialty_filters %}
        <label class="specialty-chip {% if spec in selected_specialties|default([]) %}is-active{% endif %}">
          <input type="checkbox" name="specialty" value="{{ spec }}" {% if spec in selected_specialties|default([]) %}checked{% endif %}>
          <span>{{ spec }}</span>
        </label>
      {% endfor %}
    </div>
  {% endif %}
  <div class="therapist-filter-fields">
    <div class="search-autocomplete-wrap">
      <input
        type="text"
        name="q"
        class="therapist-search-input"
        placeholder="{{ t('search.placeholder') }}"
        value="{{ search_q }}"
        autocomplete="off"
        data-search-input
      >
      <ul class="search-suggestions" data-search-suggestions hidden></ul>
    </div>
    <select name="city" data-city-field>
      <option value="">{{ t('search.all_cities') }}</option>
      {% for city in popular_cities %}
        <option value="{{ city }}" {% if selected_city == city %}selected{% endif %}>{{ city }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary">{{ filter_button|default(t('search.filter')) }}</button>
  </div>
</form>
